name: Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongodb/mongodb-community-server:9.0-ubi9-slim
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_PROVIDER: local
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB_NAME: steam_doma_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v

      - name: Build production image
        if: github.event_name == 'pull_request'
        run: docker build -t steam-doma-backend:ci .

      - name: Verify production image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            --entrypoint python \
            steam-doma-backend:ci \
            -c "import steam_doma.main; print('Application imports OK')"

  publish:
    name: Publish to Azure Container Registry
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_NAME: ${{ vars.ACR_LOGIN_SERVER }}/steam-doma-backend
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Verify production image
        run: |
          docker run --rm \
            --entrypoint python \
            "$IMAGE_NAME:$IMAGE_TAG" \
            -c "import steam_doma.main; print('Application imports OK')"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Push production image
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"