name: Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongodb/mongodb-community-server:9.0-ubi9-slim
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_PROVIDER: local
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_DB_NAME: steam_doma_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v

      - name: Build production image
        if: github.event_name == 'pull_request'
        run: docker build -t steam-doma-backend:ci .

      - name: Verify production image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            --entrypoint python \
            steam-doma-backend:ci \
            -c "import steam_doma.main; print('Application imports OK')"

  publish:
    name: Publish to Azure Container Registry
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      IMAGE_NAME: ${{ vars.ACR_LOGIN_SERVER }}/steam-doma-backend
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      - name: Verify production image
        run: |
          docker run --rm \
            --entrypoint python \
            "$IMAGE_NAME:$IMAGE_TAG" \
            -c "import steam_doma.main; print('Application imports OK')"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Push production image
        run: docker push "$IMAGE_NAME:$IMAGE_TAG"

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 15

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      IMAGE_NAME: ${{ vars.ACR_LOGIN_SERVER }}/steam-doma-backend
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify revision mode
        run: |
          MODE=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.activeRevisionsMode \
            --output tsv)

          if [[ "$MODE" != "Single" ]]; then
            echo "Expected Single revision mode, got: $MODE"
            exit 1
          fi

      - name: Deploy production image
        id: deploy
        run: |
          REVISION=$(az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --query properties.latestRevisionName \
            --output tsv)

          test -n "$REVISION"

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Deployed revision: $REVISION"

      - name: Wait for revision readiness
        env:
          TARGET_REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          for attempt in $(seq 1 30); do
            READY_REVISION=$(az containerapp show \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.latestReadyRevisionName \
              --output tsv)

            if [[ "$READY_REVISION" == "$TARGET_REVISION" ]]; then
              echo "Revision is ready: $READY_REVISION"
              exit 0
            fi

            echo "Waiting for revision readiness..."
            sleep 10
          done

          echo "Revision did not become ready"
          exit 1

      - name: Get application URL
        id: application
        run: |
          FQDN=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          test -n "$FQDN"

          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"
          echo "Application URL: https://$FQDN"

      - name: Health smoke test
        env:
          APP_URL: ${{ steps.application.outputs.url }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 45 \
            "$APP_URL/health" \
            | jq -e '.status == "ok"'

      - name: GraphQL smoke test
        env:
          APP_URL: ${{ steps.application.outputs.url }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 45 \
            -X POST "$APP_URL/graphql" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ ping }"}' \
            | jq -e '.data.ping == "pong" and ((.errors // []) | length == 0)'