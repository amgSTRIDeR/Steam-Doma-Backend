
[project]
name = "steam-doma-backend"
version = "0.1.0"
description = "Backend API for Steam Doma"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi",
    "strawberry-graphql[fastapi]",
    "pymongo",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pre-commit>=4.7.0",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_doma"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
