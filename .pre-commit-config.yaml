
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --no-sync ruff check --fix
        language: unsupported
        types: [python]
        require_serial: true

      - id: ruff-format
        name: Ruff format
        entry: uv run --no-sync ruff format
        language: unsupported
        types: [python]
        require_serial: true
